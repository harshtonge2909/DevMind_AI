[project]
name = "devmind-ai"
version = "0.1.0"
description = "DevMind AI - Intelligent Software Engineering Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.3.4",
    "langchain-text-splitters>=1.1.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "streamlit>=1.66.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
